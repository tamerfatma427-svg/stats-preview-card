<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preview Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
    <div class="content">
        <div class="title">
            <h2>Get <span class="fatma">insights</span> that help your business grow.</h2>
        </div>
        <div class="paragraph">
            <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
        </div>
        <div class="stats">
            <div class="box">
                <h2>10k+</h2>
                <p>COMPANIES</p>
            </div>
            <div class="box">
                 <h2>314</h2>
                <p>TEMPLATES</p>
            </div>
            <div class="box">
                 <h2>12M+</h2>
                <p>QUERIES</p>
            </div>
        </div>
    </div>
     <div class="image">
        <img class="imag" src="image-header-desktop.jpg" alt="header">
    </div>
</div>
</body>
</html>
